<header
  class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-outline-variant/20 bg-surface/80 px-4 backdrop-blur-md md:px-8"
>
  <button
    type="button"
    class="rounded-lg p-2 text-on-surface-variant transition-colors hover:bg-surface-variant/40 hover:text-primary md:hidden"
    aria-label="Open menu"
    (click)="menuClick.emit()"
  >
    <ptf-icon name="menu" size="md" />
  </button>

  <div class="min-w-0 flex-1">
    <h1 class="truncate font-headline-md text-headline-md text-on-surface">{{ title() }}</h1>
  </div>

  <div
    class="hidden items-center gap-2 rounded-full border border-outline-variant/20 bg-surface-container px-3 py-1.5 sm:flex"
  >
    <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
    <span class="whitespace-nowrap font-label-sm text-label-sm text-on-surface-variant">{{
      availability()
    }}</span>
  </div>
</header>
