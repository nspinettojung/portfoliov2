@if (open()) {
  <div
    class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm md:hidden"
    aria-hidden="true"
    (click)="close.emit()"
  ></div>
}

<aside [class]="asideClasses()">
  <div class="flex items-center gap-3 border-b border-outline-variant/20 px-6 py-5">
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary/15 text-primary"
    >
      <ptf-icon name="terminal" size="lg" />
    </div>

    <div class="min-w-0">
      <p class="truncate font-headline-md text-headline-md text-on-surface">{{ brand() }}</p>
      <p class="truncate font-label-sm text-label-sm text-on-surface-variant">{{ role() }}</p>
    </div>

    <button
      type="button"
      class="ml-auto rounded-lg p-2 text-on-surface-variant transition-colors hover:bg-surface-variant/40 hover:text-primary md:hidden"
      aria-label="Close menu"
      (click)="close.emit()"
    >
      <ptf-icon name="close" size="md" />
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4" aria-label="Main navigation">
    @for (item of navItems; track item.link) {
      <ptf-nav-link [title]="item.label" [icon]="item.icon" [link]="item.link" />
    }
  </nav>

  <div class="border-t border-outline-variant/20 p-4">
    <div
      class="flex items-center gap-2 rounded-xl border border-outline-variant/20 bg-surface-container px-3 py-2"
    >
      <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
      <span class="font-label-sm text-label-sm text-on-surface-variant">{{ availability() }}</span>
    </div>
  </div>
</aside>
