<a
  [routerLink]="link()"
  routerLinkActive="nav-link-active"
  ariaCurrentWhenActive="page"
  [routerLinkActiveOptions]="{ exact: exact() || link() === '/' }"
  class="flex items-center gap-3 rounded-xl border-r-2 border-transparent px-4 py-3 font-medium text-on-surface-variant transition-all duration-300 hover:bg-surface-variant/30 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 focus-visible:ring-offset-2 focus-visible:ring-offset-surface active:scale-95"
>
  <span class="material-symbols-outlined">{{ icon() }}</span>
  <span class="font-label-md text-label-md">{{ title() }}</span>
</a>
