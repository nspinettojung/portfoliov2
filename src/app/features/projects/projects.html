<div class="space-y-6">
  <header class="space-y-2">
    <h1 class="font-headline-lg text-headline-lg text-on-surface">Proyectos</h1>
    <p class="max-w-2xl font-body-lg text-body-lg text-on-surface-variant">
      APIs, servicios distribuidos y herramientas que construí.
    </p>
  </header>

  <div class="grid grid-cols-1 gap-gutter md:grid-cols-2 xl:grid-cols-3">
    @for (project of projects(); track project.slug) {
      <ptf-project-card [project]="project" (viewDetails)="openProject($event)" />
    } @empty {
      <p class="font-body-md text-body-md text-on-surface-variant">Todavía no hay proyectos.</p>
    }
  </div>
</div>
