<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Auth Service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#1a2237" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#ffb4ab" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ffb4ab" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <rect width="1200" height="675" fill="url(#glow)" />

  <g fill="none" stroke="#ffb4ab" stroke-width="2">
    <circle cx="600" cy="315" r="220" stroke-opacity="0.1" />
    <circle cx="600" cy="315" r="155" stroke-opacity="0.16" />
  </g>
  <circle cx="600" cy="315" r="95" fill="#ffb4ab" fill-opacity="0.07" />

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="305" fill="#e5e8f0" font-size="68" font-weight="700">Auth Service</text>
    <text x="600" y="360" fill="#ffb4ab" font-size="22" letter-spacing="6">JAVA · SPRING BOOT · KEYCLOAK</text>
  </g>
</svg>
